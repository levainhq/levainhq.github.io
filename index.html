<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levain is retired</title>
    <meta name="description" content="Levain is retired and no longer maintained." />
    <meta name="author" content="Phillip Clapham" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { --bg: #faf8f5; --fg: #1d1a16; --muted: #5d564d; --link: #b5531c; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #100e0b; --fg: #ece6dc; --muted: #a59c8f; --link: #f08a4b; }
      }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      body {
        font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
      }
      main { max-width: 34rem; padding: 2rem 1rem; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.8rem; margin: 1rem 0 0.75rem; }
      p { margin: 0 0 1rem; }
      .small { color: var(--muted); font-size: 0.95rem; }
      a { color: var(--link); }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="/assets/levain-mark-56-dark.png" media="(prefers-color-scheme: dark)" />
        <img src="/assets/levain-mark-56-light.png" alt="" />
      </picture>
      <h1>Levain is retired.</h1>
      <p>It's no longer maintained and won't get any more updates.</p>
      <p>The code is still on <a href="https://github.com/levainhq/levain">GitHub</a>, archived and read-only. Thanks to everyone who tried it.</p>
      <p class="small">Phillip Clapham</p>
    </main>
  </body>
</html>
